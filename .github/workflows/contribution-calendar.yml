name: Refresh contribution widget

on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'

permissions:
  contents: read

concurrency:
  group: contribution-widget
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Refresh the latest 365 days of public contribution data
        run: >-
          python3 scripts/render_contribution_calendar.py
          --username UiHyeon-Kim
          --output assets/contribution-calendar-3d.svg
          --data-output data/contribution-calendar.json

      - name: Verify contribution data and failure handling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Publish the refreshed contribution widget
        shell: bash
        run: |
          git add -- assets/contribution-calendar-3d.svg data/contribution-calendar.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh contribution widget'
          git push origin HEAD:main
