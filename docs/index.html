let plain=false;const phone=document.getElementById('phone'),normal=document.getElementById('plain'),phoneContent=document.getElementById('phone-content'),listContent=document.getElementById('list-content'),toggle=document.getElementById('mode-toggle'),back=document.getElementById('back');
back.innerHTML=icon('back');document.getElementById('home-button').innerHTML=icon('home');document.getElementById('list-button').innerHTML=icon('list');
function render(focus=false){const route=normalizeRoute(location.hash);const host=plain?listContent:phoneContent;host.innerHTML=renderRoute(route,plain);(plain?phoneContent:listContent).textContent='';back.disabled=route==='home';host.scrollTop=0;document.title=(route==='home'?'Pocket Profile':route.split('/')[0])+' · UiHyeon';if(focus){const heading=host.querySelector('#content-start');if(heading)heading.focus({preventScroll:true});}}
function setMode(){plain=!plain;phone.hidden=plain;normal.hidden=!plain;document.getElementById('layout').classList.toggle('list-mode',plain);toggle.textContent=plain?'폰 모양으로 돌아가기':'폰 대신 목록으로 보기';toggle.setAttribute('aria-pressed',String(plain));render(true)}
toggle.addEventListener('click',setMode);document.getElementById('list-button').addEventListener('click',setMode);
back.addEventListener('click',()=>{location.hash='/'+parentRoute(location.hash)});
window.addEventListener('hashchange',()=>render(true));
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&normalizeRoute(location.hash)!=='home'){event.preventDefault();location.hash='/'+parentRoute(location.hash)}if(!plain&&event.target.matches('.app-link')&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){const links=[...phoneContent.querySelectorAll('.app-link')];const offset=event.key==='ArrowLeft'?-1:event.key==='ArrowRight'?1:event.key==='ArrowUp'?-2:2;const i=links.indexOf(event.target);links[(i+offset+links.length)%links.length].focus();event.preventDefault();}});
if(new URLSearchParams(location.search).get('view')==='list')setMode();else render();
}
</script></body></html>
