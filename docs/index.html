<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://github.com https://avatars.githubusercontent.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="description" content="Android 개발자 김의현의 포트폴리오. Rodi, 구름한장, PoseUp 등 프로젝트와 개발 기록을 폰 화면으로 둘러보세요.">
<title>김의현 · Android Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F172A;--muted:#475569;--green:#1FA862;--green-ink:#146C43;--tonal:#E6EFE9;--chip:#C6F3D8;--app-bg:#F5F9F6;--app-ink:#101814;--app-muted:#4A5850}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#D6DFE2;word-break:keep-all;overflow-wrap:break-word;color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--green-ink)}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green-ink);outline-offset:3px}
[hidden]{display:none!important}
.ub{font-family:"Unbounded","Noto Sans KR",sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.skip{position:fixed;left:16px;top:-80px;z-index:20;background:#fff;padding:12px 16px;border-radius:12px}
.skip:focus{top:12px}

/* page */
.page{position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(ellipse 60% 75% at 70% 46%,#FFFFFF 0%,#EEF3F4 42%,#D6DFE2 100%)}
.wrap{position:relative;z-index:2;max-width:1320px;margin:0 auto;padding:28px 48px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{background:none;border:0;padding:0;min-height:44px;font-size:18px;font-weight:700;letter-spacing:-.02em;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.logo span{color:var(--green)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:99px;font-size:13px;text-decoration:none;color:var(--ink);border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.55);box-shadow:0 4px 14px -8px rgba(15,23,42,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background .2s,color .2s}
.pill:hover{background:#fff;color:var(--ink)}
.pill[aria-current="page"]{background:var(--ink);color:#F8FAFC;border-color:var(--ink)}
main.layout{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:32px 48px}
.intro{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:24px}
.badge{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.65);border:1px solid #fff;font-size:13px;color:#334155}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.intro h1{margin:0;font-size:clamp(46px,5.6vw,82px);line-height:1.02;font-weight:700;letter-spacing:-.045em}
.intro h1 span{color:var(--green)}
.intro .lead-copy{margin:0;max-width:440px;font-size:18px;line-height:1.7;color:#334155;text-wrap:pretty}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:99px;border:0;background:var(--ink);color:#F8FAFC;font-weight:700;font-size:15px;text-decoration:none;box-shadow:0 18px 30px -14px rgba(15,23,42,.7)}
.cta:hover{color:#F8FAFC;background:#1E293B}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:480px;margin-top:4px}
.stat{display:block;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.95);border-radius:22px;padding:16px 18px;text-align:left;text-decoration:none;color:var(--ink);box-shadow:0 18px 40px -26px rgba(15,23,42,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .25s}
.stat:hover{transform:translateY(-4px);color:var(--ink)}
.stat b{display:block;font-family:"Unbounded",sans-serif;font-size:28px}
.stat span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.mode{align-self:flex-start;background:none;border:0;padding:8px 0;min-height:44px;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:4px}

/* stage */
.stage{flex:1 1 620px;min-width:0;position:relative;height:calc(860px * var(--fit,1))}
.stage-inner{position:absolute;left:50%;top:0;width:640px;height:860px;margin-left:-320px;transform:scale(var(--fit,1));transform-origin:50% 0}
.spot{position:absolute;left:10px;top:80px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,.4) 55%,transparent 72%)}
.dots{position:absolute;left:10px;top:80px;width:620px;height:620px;border-radius:50%;background-image:radial-gradient(rgba(15,23,42,.16) 1px,transparent 1.3px);background-size:20px 20px;-webkit-mask-image:radial-gradient(circle,transparent 30%,#000 52%,transparent 72%);mask-image:radial-gradient(circle,transparent 30%,#000 52%,transparent 72%)}
.obj{position:absolute;animation:bob 8s ease-in-out infinite}
.orb-g{border-radius:50%;background:radial-gradient(circle at 32% 28%,#E3FFEE 0%,#6BEDA6 26%,#1FA862 60%,#0A5732 100%);box-shadow:0 34px 44px -24px rgba(10,87,50,.6)}
.orb-n{border-radius:50%;background:radial-gradient(circle at 32% 28%,#A9B6CC 0%,#3B4A63 38%,#0F172A 78%);box-shadow:0 26px 36px -20px rgba(15,23,42,.6)}
.torus{border-radius:50%;border:24px solid transparent;background:conic-gradient(from 210deg,#1E293B,#94A3B8,#1E293B,#020617,#1E293B) border-box;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 24px),#000 calc(100% - 23px));mask:radial-gradient(farthest-side,transparent calc(100% - 24px),#000 calc(100% - 23px))}
.capsule{border-radius:99px;background:linear-gradient(100deg,#0A5732 0%,#3DDC84 44%,#D3FBE4 54%,#1FA862 100%);box-shadow:0 26px 36px -20px rgba(10,87,50,.55)}
.disc{position:absolute;left:130px;top:728px;width:380px;height:76px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#FFFFFF 0%,#E8EEF0 60%,#CBD5DA 100%);box-shadow:0 22px 30px -18px rgba(15,23,42,.35),inset 0 -3px 8px rgba(15,23,42,.08)}
.disc-shadow{position:absolute;left:195px;top:748px;width:250px;height:30px;border-radius:50%;background:radial-gradient(ellipse,rgba(15,23,42,.38),transparent 70%);filter:blur(6px);animation:shadow 7s ease-in-out infinite}

/* device */
.float{position:absolute;left:140px;top:24px;animation:float 7s ease-in-out infinite}
.rig{position:relative;width:360px;height:748px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.frame{position:absolute;inset:0;border-radius:48px;background:linear-gradient(115deg,#97A3AB 0%,#EEF2F4 20%,#B6C0C6 40%,#F6F8F9 56%,#A4AFB6 80%,#DDE3E6 100%);box-shadow:0 50px 70px -40px rgba(15,23,42,.7),0 14px 26px -16px rgba(15,23,42,.4)}
.key{position:absolute;right:-3px;width:4px;border-radius:0 3px 3px 0;background:linear-gradient(90deg,#8E9AA2,#D3DADE)}
.bezel{position:absolute;inset:3px;border-radius:45px;background:#0A0F14;padding:7px}
.glare{position:absolute;inset:10px;border-radius:38px;pointer-events:none;background:linear-gradient(118deg,transparent 30%,rgba(255,255,255,.2) 44%,rgba(255,255,255,.04) 52%,transparent 64%);background-size:260% 100%;background-position:50% 0;transition:background-position .5s}

/* app UI (shared by phone + list mode) */
.screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--app-bg);color:var(--app-ink);font-family:"Roboto","Noto Sans KR",sans-serif;display:flex;flex-direction:column}
.cam{position:absolute;top:11px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:#05080B;z-index:3}
.bar{flex:none;height:96px;padding:36px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:4px}
.bar.detail{padding-left:9px;justify-content:flex-start}
.bar-title{font-size:22px;font-weight:500;letter-spacing:-.01em;margin:0;outline:none}
.bar-title:focus,.bar-title:focus-visible{outline:none}
.bar.detail .bar-title{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{position:relative;width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:#0F172A;color:#3DDC84;font-family:"JetBrains Mono",monospace;font-size:11px;text-decoration:none;box-shadow:0 0 0 2px var(--app-bg),0 0 0 3px #C2CEC6;transition:box-shadow .2s}
.avatar:hover{box-shadow:0 0 0 2px var(--app-bg),0 0 0 3px var(--green)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar .go{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:50%;background:var(--green-ink);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--app-bg)}
.back{width:44px;height:44px;flex:none;border:0;background:none;border-radius:50%;display:grid;place-items:center}
.back:hover{background:var(--tonal)}
.body{flex:1;overflow:auto;scrollbar-width:none;padding:4px 20px 28px;display:flex;flex-direction:column;gap:12px;animation:enter .35s cubic-bezier(.2,.8,.2,1)}
.body::-webkit-scrollbar{display:none}
.body>*{flex-shrink:0}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.06em;color:var(--green-ink)}
.h{margin:0;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:0;font-size:15px;line-height:1.6;text-wrap:pretty}
.txt{margin:0;font-size:13px;line-height:1.7;color:var(--app-muted);text-wrap:pretty}
.hero{border-radius:20px;padding:18px 18px 22px;background:#0F172A;color:#F8FAFC;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(61,220,132,.45),transparent 70%)}
.hero>*{position:relative;z-index:1}
.tonal{border-radius:16px;padding:14px 16px 18px;background:var(--tonal)}
.tonal-k{font-size:11px;font-weight:700;color:var(--green-ink)}
.tonal-v{font-size:13px;line-height:1.6;margin-top:4px;text-wrap:pretty}
.sec{margin:8px 0 -4px;font-size:12px;font-weight:700;color:var(--app-muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{height:32px;padding:0 14px;border-radius:8px;border:1px solid #C2CEC6;background:transparent;font-size:12px;color:#2F3D35}
.fchip{display:inline-flex;align-items:center;text-decoration:none}
.fchip[aria-current="page"],.fchip[aria-pressed="true"]{background:var(--chip);border-color:var(--chip);color:#052E19;font-weight:500}
.mchip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:8px;border:1px solid #C2CEC6;background:#fff;font-size:11px;color:#2F3D35}
.list{display:flex;flex-direction:column;margin:0 -12px}
.li{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;padding:10px 12px;text-align:left;min-height:60px;border-radius:14px;text-decoration:none;color:inherit;transition:background .15s}
.li:hover{background:var(--tonal);color:inherit}
.li-lead{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--chip);color:#0B4A2A;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500}
.li-lead svg{width:22px;height:22px}
.tech-hero{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--chip);color:#0B4A2A}
.tech-hero svg{width:30px;height:30px}
.li-t{display:block;font-size:14px;font-weight:500;text-wrap:pretty}
.li-s{display:block;font-size:12px;color:var(--app-muted);margin-top:2px;line-height:1.45;text-wrap:pretty}
.card{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;text-decoration:none;color:inherit;background:#fff;border-radius:18px;padding:16px 16px 20px;box-shadow:0 1px 2px rgba(16,24,20,.08),0 2px 8px -2px rgba(16,24,20,.08);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);color:inherit;box-shadow:0 2px 4px rgba(16,24,20,.08),0 10px 20px -8px rgba(16,24,20,.2)}
.card-t{font-size:16px;font-weight:700}
.card-s{font-size:12px;line-height:1.55;color:var(--app-muted);text-wrap:pretty}
.link{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 16px;min-height:48px;border-radius:14px;background:#fff;border:1px solid #D5DED8;text-decoration:none;font-size:13px;color:var(--app-ink)}
.link:hover{border-color:var(--green-ink);color:var(--app-ink)}
.more{display:inline-block;margin-top:8px;font-size:12px;font-weight:500;color:var(--green-ink);text-decoration:none;padding:6px 0}
.more:hover{text-decoration:underline}
.flow{list-style:none;margin:0;padding:0;counter-reset:f;display:flex;flex-direction:column}
.flow li{position:relative;counter-increment:f;padding:0 0 16px 38px;font-size:13px;line-height:26px}
.flow li::before{content:counter(f);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--chip);color:#0B4A2A;font:500 12px/26px "JetBrains Mono",monospace;text-align:center}
.flow li:not(:last-child)::after{content:"";position:absolute;left:12.5px;top:28px;bottom:2px;width:1px;background:#B9CBBF}
.flow li:last-child{padding-bottom:0}
.sel{user-select:all;-webkit-user-select:all}
.copy{height:32px;padding:0 12px;border-radius:99px;border:1px solid #C2CEC6;background:#fff;font-size:12px;color:var(--app-ink)}
.copy:hover{border-color:var(--green-ink)}
.row{display:flex;justify-content:space-between;gap:12px;font-size:12px;line-height:1.5;padding:8px 0;border-bottom:1px solid #DDE6E0}
.row span:first-child{color:var(--app-muted);flex:none;font-family:"JetBrains Mono",monospace;font-size:11px}
.row span:last-child{text-align:right}
.land-cta{position:relative;display:block;width:100%;padding:0;border:0;border-radius:14px;overflow:hidden;background:#0B0B0B;box-shadow:0 1px 2px rgba(16,24,20,.1),0 6px 14px -8px rgba(16,24,20,.4)}
.land-cta img{display:block;width:100%;height:auto}
.land-tag{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;background:rgba(245,249,246,.94);color:var(--app-ink);font-size:11px;font-weight:500}
.land-cta:hover .land-tag{background:var(--chip)}
.shots{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 4px}
.shots::-webkit-scrollbar{display:none}
.shot{flex:none;width:116px;height:auto;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,20,.12),0 4px 10px -6px rgba(16,24,20,.35)}
.code{white-space:pre-wrap;margin:0;padding:14px 16px;border-radius:14px;background:#0F172A;color:var(--chip);font-family:"JetBrains Mono",monospace;font-size:11.5px;line-height:1.8}
.nav{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:10px 8px 6px;background:#EBF2ED}
.nv{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--app-muted);min-height:52px;text-decoration:none}
.nv .ind{width:56px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.nv[aria-current="page"]{color:var(--app-ink);font-weight:700}
.nv[aria-current="page"] .ind{background:var(--chip);color:#052E19}
.gesture{height:20px;flex:none;display:flex;align-items:center;justify-content:center;background:#EBF2ED}
.gesture span{width:96px;height:4px;border-radius:2px;background:var(--app-ink);opacity:.5}

/* landscape viewer */
.land{position:absolute;left:50%;top:50%;width:728px;height:340px;margin:-170px 0 0 -364px;transform:rotate(90deg);background:#0B0B0B;z-index:6;animation:fade .4s ease .25s both}
.land img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.land-x{position:absolute;right:10px;top:10px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#F8FAFC;display:grid;place-items:center}
.land-x:hover{background:rgba(255,255,255,.22)}
.land-seg{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;padding:4px;border-radius:99px;background:rgba(255,255,255,.08)}
.land-seg button{height:32px;padding:0 12px;border:0;border-radius:99px;background:none;color:#CBD5E1;font-size:11px}
.land-seg button[aria-pressed="true"]{background:var(--chip);color:#052E19;font-weight:500}

/* list mode */
.plain{flex:1;width:100%;max-width:760px;margin:24px auto 0;background:var(--app-bg);color:var(--app-ink);border-radius:28px;padding:28px 32px 36px;box-shadow:0 30px 60px -40px rgba(15,23,42,.5);font-family:"Roboto","Noto Sans KR",sans-serif}
.plain .bar{height:auto;padding:0 0 12px}
.plain .bar-title{font-size:28px;font-weight:700}
.plain .body{padding:0;overflow:visible;animation:none}
.plain .lead{font-size:17px}
.plain .txt{font-size:15px}
.plain .shots{margin:0;padding:2px 0}
.plain .shot{width:150px}
.plain .land-cta{max-width:520px}
.plain-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}

footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:12px;font-size:12px;color:var(--muted)}
footer a{color:var(--muted)}
noscript .ns{max-width:760px;margin:24px auto;padding:24px;background:#fff;border-radius:20px;line-height:1.7}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.88);opacity:.65}}
@keyframes enter{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:1000px){.wrap{padding:20px 20px 24px}.obj,.dots{display:none}main.layout{padding-top:12px}.intro{flex-basis:100%}}
@media (max-width:520px){.intro h1{font-size:44px}.stats{gap:8px}.stat{padding:14px}.stat b{font-size:22px}.plain{padding:22px 18px 28px;border-radius:22px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#app-title">본문으로 이동</a>
<div class="page" id="page">
  <div class="wrap">
    <header class="top">
      <a class="logo ub" href="#/about" aria-label="처음으로">uihyeon<span>●</span></a>
      <nav class="pills" aria-label="섹션">
        <a class="pill" href="#/about" data-tab="about">About</a>
        <a class="pill" href="#/stack" data-tab="stack">Stack</a>
        <a class="pill" href="#/projects" data-tab="projects">Projects</a>
        <a class="pill" href="#/notes" data-tab="notes">Notes</a>
      </nav>
    </header>

    <main class="layout" id="layout">
      <section class="intro" aria-label="소개">
        <div class="badge"><i aria-hidden="true"></i>Android Developer · SSAFY 16기</div>
        <h1 class="ub">Hi, I’m<br>UiHyeon<span>.</span></h1>
        <p class="lead-copy">직접 써 보며 찾은 문제를, 팀이 고를 수 있는 선택지로 만듭니다.</p>
        <div class="ctas">
          <a class="cta" href="#/projects">프로젝트 보기 →</a>
          <a class="pill" href="https://github.com/UiHyeon-Kim" target="_blank" rel="noopener noreferrer" style="min-height:52px;padding:0 22px">GitHub ↗</a>
        </div>
        <div class="stats" id="stats"></div>
        <button class="mode" id="mode" aria-pressed="false">폰 대신 목록으로 보기</button>
      </section>

      <section class="stage" id="stage" aria-label="폰 모양 포트폴리오">
        <div class="stage-inner">
          <div class="spot" aria-hidden="true"></div>

function parse(hash) {
  const r = String(hash || '').replace(/^#\/?/, '');
  if (r === '' || r === 'home') return { tab: 'about' };
  if (TABS[r]) return { tab: r };
  if (r === 'stack/tools') return { tab: 'stack', group: 'tools' };
  if (r === 'ai') return { tab: 'stack', group: 'ai' };
  const [kind, id] = r.split('/');
  if (kind === 'ai' && byId(AI, id)) return { tab: 'stack', detail: 'ai', id, group: 'ai' };
  if (kind === 'project' && byId(PROJECTS, id)) return { tab: 'projects', detail: 'project', id };
  if (kind === 'note' && byId(NOTES, id)) return { tab: 'notes', detail: 'note', id };
  if (kind === 'tech' && byId(TECHS, id)) return { tab: 'stack', detail: 'tech', id, group: byId(TECHS, id).g };
  if (kind === 'project' || kind === 'note' || kind === 'tech') return { tab: { project: 'projects', note: 'notes', tech: 'stack' }[kind] };
  return { tab: 'about' };
}

const extLink = l => '<a class="link" href="' + esc(l[1]) + '" target="_blank" rel="noopener noreferrer">' + esc(l[0]) + '<span aria-hidden="true">↗</span></a>';
const metaRows = m => m.map(x => '<div class="row"><span>' + esc(x[0]) + '</span><span>' + esc(x[1]) + '</span></div>').join('');
const landButton = frame => '<button class="land-cta" type="button" data-action="landscape" data-frame="' + frame + '" aria-label="운동 화면을 가로로 돌려 보기"><img src="' + IMG + FRAMES[frame][0] + '.webp" alt="' + esc(FRAMES[frame][1]) + '" width="1400" height="510"><span class="land-tag">' + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>' + (state.plain ? '크게 보기' : '가로로 돌려 보기') + '</span></button>';

function aboutBody() {
  return '<div class="hero"><div class="mono" style="font-size:10px;letter-spacing:.12em;color:#9FD9C0">ANDROID DEVELOPER</div>' +
    '<div style="font-size:24px;font-weight:700;margin-top:8px">김의현</div>' +
    '<div style="font-size:12px;color:#CBD5E1;margin-top:2px">Kotlin · Jetpack Compose · SSAFY 16기</div>' +
    '<div style="font-size:13px;line-height:1.6;margin-top:12px;color:#E2E8F0">앱을 직접 써 보며 문제를 찾는 Android 개발자입니다.</div></div>' +
    '<p class="sec">일하는 방식</p>' +
    WAYS.map(w => '<div class="tonal"><div class="tonal-k">' + esc(w[0]) + '</div><div class="tonal-v">' + esc(w[1]) + '</div>' + (w[2] ? '<a class="more" href="' + w[2] + '">AI 활용 방식과 적용 사례 보기 →</a>' : '') + '</div>').join('') +
    '<p class="sec">활동</p><div>' + metaRows(ACTIVITY) + '</div>' +
    '<a class="link" href="https://github.com/UiHyeon-Kim" target="_blank" rel="noopener noreferrer">GitHub · UiHyeon-Kim<span aria-hidden="true">↗</span></a>' +
    '<div class="link"><span class="sel">hyunkim6790@gmail.com</span><button type="button" class="copy" data-action="copy" data-copy="hyunkim6790@gmail.com" aria-label="이메일 주소 복사">복사</button></div>';
}
function stackBody(r) {
  const g = r.group || 'android';
  const chip = (href, key, label) => '<a class="fchip" href="' + href + '"' + (g === key ? ' aria-current="page"' : '') + '>' + label + '</a>';
  let h = '<nav class="chips" aria-label="기술 분류">' + chip('#/stack', 'android', 'Android') + chip('#/stack/tools', 'tools', '테스트 · 빌드 · 협업') + chip('#/ai', 'ai', 'AI 활용') + '</nav>';
  if (g === 'ai') return h + '<p class="txt">' + esc(AI_INTRO) + '</p><div class="list">' + AI.map(a => liLink('#/ai/' + a.id, aiIcon(a.id), a.name, a.use, true)).join('') + '</div>';
  h += '<div class="list">' + TECHS.filter(t => t.g === g).map(t => liLink('#/tech/' + t.id, techIcon(t.id), t.name, t.use, true)).join('') + '</div>';
  if (g === 'tools') h += '<p class="txt" style="font-size:12px">학습 중 · Java · Spring (SSAFY)</p>';
  return h;
}
function aiBody(a) {
  let h = '<span class="tech-hero" aria-hidden="true">' + aiIcon(a.id) + '</span><span class="eyebrow">AI 활용' + (a.tools ? ' · ' + esc(a.tools) : '') + '</span><p class="lead">' + esc(a.use) + '</p>';
  h += '<p class="txt">' + esc(a.detail) + '</p>';
  h += '<p class="sec">내가 한 일</p><div>' + metaRows(a.role) + '</div>';
  if (a.evolve) h += '<p class="sec">발전 과정</p><div>' + metaRows(a.evolve) + '</div>';
  h += '<p class="sec">' + esc(a.flowLabel) + '</p><ol class="flow">' + a.flow.map(f => '<li>' + esc(f) + '</li>').join('') + '</ol>';
  return h;
}
function projectsBody() {
  return PROJECTS.map((p, i) => '<a class="card" href="#/project/' + p.id + '"><span class="eyebrow">' + pad(i + 1) + ' · ' + esc(p.kind) + '</span><span class="card-t">' + esc(p.title) + '</span><span class="card-s">' + esc(p.summary) + '</span></a>').join('');
}
function notesBody() {
  return '<p class="txt">문제를 어떻게 발견했고, 무엇을 판단했는지에 대한 짧은 기록입니다.</p><div class="list">' +
    NOTES.map((n, i) => liLink('#/note/' + n.id, pad(i + 1), n.title, n.caption)).join('') + '</div>';
}
function projectBody(p) {
  let h = '<span class="eyebrow">' + esc(p.kind) + '</span><p class="lead">' + esc(p.summary) + '</p>';
  if (p.shots) h += landButton('good') + '<div class="shots" tabindex="0" aria-label="PoseUp 화면 모음">' + SHOTS.map(s => '<img class="shot" src="' + IMG + s[0] + '.webp" alt="' + esc(s[1]) + '" width="540" height="1118" loading="lazy">').join('') + '</div>';
  h += '<div class="chips">' + p.tags.map(t => '<span class="mchip">' + esc(t) + '</span>').join('') + '</div>';
  h += '<p class="txt">' + esc(p.body) + '</p><div>' + metaRows(p.meta) + '</div>';
  if (p.notes.length) h += '<p class="sec">이 프로젝트의 기록</p><div class="list">' + p.notes.map(id => { const n = byId(NOTES, id); return liLink('#/note/' + n.id, pad(NOTES.indexOf(n) + 1), n.title, ''); }).join('') + '</div>';
  h += p.links.map(extLink).join('');
  return h;
}
function noteBody(n) {
  const p = byId(PROJECTS, n.project);
  let h = '<span class="eyebrow">' + esc(n.caption) + '</span><h3 class="h">' + esc(n.title) + '</h3><p class="lead" style="white-space:pre-line">' + esc(n.lead) + '</p>';
  if (n.shot) h += landButton(n.shot);
  h += '<p class="txt">' + esc(n.body) + '</p>';
  if (n.team) h += '<div class="tonal"><div class="tonal-k">팀의 결정</div><div class="tonal-v">' + esc(n.team) + '</div></div>';
  if (n.check) h += '<div class="tonal"><div class="tonal-k">확인한 것</div><div class="tonal-v">' + esc(n.check) + '</div></div>';
  if (n.limit) h += '<div class="tonal"><div class="tonal-k">한계와 다음</div><div class="tonal-v">' + esc(n.limit) + '</div></div>';
  h += '<a class="link" href="#/project/' + p.id + '">' + esc(p.title) + ' 프로젝트 보기<span aria-hidden="true">→</span></a>';
  h += n.links.map(extLink).join('');
  return h;
}
function techBody(t) {
  return '<span class="tech-hero" aria-hidden="true">' + techIcon(t.id) + '</span><span class="eyebrow">STACK · USE CASE</span><p class="lead">' + esc(t.use) + '</p><p class="sec">쓴 프로젝트</p><div class="list">' +
    t.p.map(id => { const p = byId(PROJECTS, id); return liLink('#/project/' + p.id, pad(PROJECTS.indexOf(p) + 1), p.title, p.summary); }).join('') + '</div>';
}

function screenHTML(r) {
  let title, body;
  if (r.detail === 'project') { const p = byId(PROJECTS, r.id); title = p.title; body = projectBody(p); }
  else if (r.detail === 'note') { const n = byId(NOTES, r.id); title = n.title; body = noteBody(n); }
  else if (r.detail === 'tech') { const t = byId(TECHS, r.id); title = t.name; body = techBody(t); }
  else if (r.detail === 'ai') { const a = byId(AI, r.id); title = a.name; body = aiBody(a); }
  else { title = TABS[r.tab]; body = { about: aboutBody, stack: stackBody, projects: projectsBody, notes: notesBody }[r.tab](r); }
  const bar = r.detail
    ? '<div class="bar detail"><a class="back" href="' + parentHash(r) + '" aria-label="뒤로">' + '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></a><h2 class="bar-title" id="app-title" tabindex="-1">' + esc(title) + '</h2></div>'
    : '<div class="bar"><h2 class="bar-title" id="app-title" tabindex="-1">' + esc(title) + '</h2>' + AVATAR + '</div>';
  return { bar, body: '<div class="body">' + body + '</div>' };
}

function landHTML() {
  const f = FRAMES[state.frame];
  return '<div class="land" role="dialog" aria-label="PoseUp 운동 화면 가로 보기"><img src="' + IMG + f[0] + '.webp" alt="' + esc(f[1]) + '">' +
    '<button class="land-x" type="button" data-action="portrait" aria-label="세로로 돌아가기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' +
    '<div class="land-seg" role="group" aria-label="판정 예시"><button type="button" data-action="frame" data-frame="good" aria-pressed="' + (state.frame === 'good') + '">정상 판정</button><button type="button" data-action="frame" data-frame="slow" aria-pressed="' + (state.frame === 'slow') + '">너무 빠른 하강</button></div></div>';
}

const el = id => document.getElementById(id);
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
const finePointer = window.matchMedia('(pointer: fine) and (min-width: 1001px)');

function applyTransform() {
  const rig = el('rig');
  const tilt = finePointer.matches && !reduce.matches;
  const rx = tilt ? (-state.my * 8).toFixed(1) : 0;
  const ry = tilt ? (-5 + state.mx * 14).toFixed(1) : (finePointer.matches ? -5 : 0);
  rig.style.transform = 'perspective(1800px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)' + (state.landscape ? ' rotateZ(-90deg) scale(.84)' : '');
  el('glare').style.backgroundPosition = (55 - state.mx * 80).toFixed(1) + '% 0';
}
function fit() {
  const stage = el('stage');
  const w = stage.clientWidth;
  const base = state.landscape ? 640 : (window.innerWidth <= 1000 ? 400 : 640);
  const f = Math.min(1, w / base);
  stage.style.setProperty('--fit', f.toFixed(3));
}

function render(focus) {
  const r = parse(location.hash);
  document.querySelectorAll('.pill[data-tab]').forEach(a => { if (a.dataset.tab === r.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const s = screenHTML(r);
  if (state.plain) {
    el('plain').innerHTML = '<nav class="plain-nav" aria-label="목록 메뉴">' + Object.keys(TABS).map(k => '<a class="pill" href="#/' + k + '"' + (k === r.tab ? ' aria-current="page"' : '') + '>' + TABS[k] + '</a>').join('') + '</nav>' + s.bar + s.body;
    el('screen').innerHTML = '';
  } else {
    const nav = '<nav class="nav" aria-label="앱 탭">' + Object.keys(TABS).map(k => '<a class="nv" href="#/' + k + '"' + (k === r.tab ? ' aria-current="page"' : '') + '><span class="ind">' + icon(ICONS[k]) + '</span>' + { about: '나', stack: '스택', projects: '프로젝트', notes: '기록' }[k] + '</a>').join('') + '</nav>';
    el('screen').innerHTML = '<span class="cam" aria-hidden="true"></span>' + (state.landscape ? landHTML() : '') + s.bar + s.body + nav + '<div class="gesture" aria-hidden="true"><span></span></div>';
    el('plain').innerHTML = '';
  }
  document.title = (r.detail ? s.bar.replace(/<[^>]+>/g, '') + ' · ' : (r.tab === 'about' ? '' : TABS[r.tab] + ' · ')) + '김의현 · Android Developer';
  applyTransform(); fit();
  if (focus) { const t = el('app-title'); if (t) t.focus({ preventScroll: true }); }
}

function setMode(plain) {
  state.plain = plain; state.landscape = false;
  el('stage').hidden = plain; el('plain').hidden = !plain;
  const b = el('mode'); b.textContent = plain ? '폰 모양으로 돌아가기' : '폰 대신 목록으로 보기'; b.setAttribute('aria-pressed', String(plain));
  render(true);
}

el('stats').innerHTML = [['projects', PROJECTS.length, '프로젝트'], ['stack', TECHS.length, '기술 스택'], ['notes', NOTES.length, '개발 기록']]
  .map(s => '<a class="stat" href="#/' + s[0] + '"><b>' + pad(s[1]) + '</b><span>' + s[2] + '</span></a>').join('');

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action;
  if (a === 'landscape') {
    state.frame = b.dataset.frame || 'good';
    if (state.plain) { window.open(IMG + FRAMES[state.frame][0] + '.webp', '_blank', 'noopener'); return; }
    state.landscape = true; render(false); el('screen').querySelector('.land-x')?.focus();
  }
  if (a === 'copy') {
    const done = t => { b.textContent = t; setTimeout(() => { b.textContent = '복사'; }, 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); done('선택됨'); };
    try { navigator.clipboard.writeText(b.dataset.copy).then(() => done('복사됨'), fallback); } catch (err) { fallback(); }
  }
  if (a === 'portrait') { state.landscape = false; render(false); el('screen').querySelector('.land-cta')?.focus(); }
  if (a === 'frame') { state.frame = b.dataset.frame; render(false); el('screen').querySelector('.land-seg [aria-pressed="true"]')?.focus(); }
});
el('mode').addEventListener('click', () => setMode(!state.plain));
window.addEventListener('hashchange', () => { state.landscape = false; render(true); });
window.addEventListener('resize', fit);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (state.landscape) { state.landscape = false; render(false); return; }
  const r = parse(location.hash);
  if (r.detail) location.hash = parentHash(r);
});
let raf = 0;
el('page').addEventListener('pointermove', e => {
  if (!finePointer.matches || reduce.matches || raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    state.mx = e.clientX / window.innerWidth - 0.5;
    state.my = e.clientY / window.innerHeight - 0.5;
    applyTransform();
  });
});
el('page').addEventListener('pointerleave', () => { state.mx = 0.1; state.my = -0.04; applyTransform(); });

if (new URLSearchParams(location.search).get('view') === 'list') setMode(true); else render(false);
</script>
</body>
</html>
